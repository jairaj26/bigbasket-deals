name: BigBasket Deal Finder & Telegram Alerts

on:
  schedule:
    # 1. Midnight Deal Drop: 12:05 AM IST (18:35 UTC) - Main daily deal & pricing reset
    - cron: '35 18 * * *'
    # 2. Morning Deal Drop: 7:35 AM IST (02:05 UTC) - Morning grocery & slot refresh
    - cron: '5 2 * * *'
    # 3. Evening Deal Drop: 6:05 PM IST (12:35 UTC) - Evening flash clearance
    - cron: '35 12 * * *'
  workflow_dispatch:
    inputs:
      pincode:
        description: 'Delivery Pincode (e.g. 560001)'
        required: false
        default: '560001'
      min_discount:
        description: 'Minimum Discount % (e.g. 70)'
        required: false
        default: '70'

jobs:
  # Phase 1: Fan-Out - 4 Parallel Runners scraping independent category chunks from 4 distinct Azure cloud IPs
  scrape-chunks:
    name: Scrape Chunk ${{ matrix.chunk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chunk: [1, 2, 3, 4]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scrape Category Chunk ${{ matrix.chunk }}
        env:
          PINCODE: ${{ github.event.inputs.pincode || secrets.PINCODE || secrets.Pincode || secrets.pincode || '560001' }}
          MIN_DISCOUNT: ${{ github.event.inputs.min_discount || '70' }}
        run: |
          python main.py --scrape-only --chunk ${{ matrix.chunk }} --pincode "$PINCODE" --min-discount "$MIN_DISCOUNT" --output "deals_chunk_${{ matrix.chunk }}.json"

      - name: Upload Chunk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deals-chunk-${{ matrix.chunk }}
          path: deals_chunk_${{ matrix.chunk }}.json
          retention-days: 1

  # Phase 2: Fan-In - Single Aggregator Job merges deals, applies 7-day cooldown diffing, & posts 1 consolidated Telegram alert
  aggregate-and-alert:
    name: Aggregate & Push Telegram Alert
    needs: scrape-chunks
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download All Deal Chunks
        uses: actions/download-artifact@v4
        with:
          path: downloaded_chunks
          pattern: deals-chunk-*
          merge-multiple: true

      - name: Restore Deal Tracker Cache
        uses: actions/cache@v4
        with:
          path: seen_deals.db
          key: bb-seen-deals-${{ github.run_id }}
          restore-keys: |
            bb-seen-deals-

      - name: Aggregate Deals & Push to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.Telegram_Bot_Token }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.Telegram_Chat_Id }}
          PINCODE: ${{ github.event.inputs.pincode || secrets.PINCODE || secrets.Pincode || secrets.pincode || '560001' }}
          MIN_DISCOUNT: ${{ github.event.inputs.min_discount || '70' }}
        run: |
          python main.py --aggregate-and-notify --input-dir downloaded_chunks --pincode "$PINCODE" --min-discount "$MIN_DISCOUNT"
